<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="color-scheme" content="dark">
  <title>Микшер звука вкладок</title>
  <link rel="stylesheet" href="sidebar.css?v=22">
</head>
<body>
  <header class="hdr">
    <div class="hdr-left">
      <img class="hdr-ico" src="icons/icon32.png" alt="">
      <div class="hdr-info">
        <div class="hdr-title-row">
          <span class="hdr-name">Микшер звука</span>
          <span class="ver-badge">v2.2</span>
          <button id="btn-reload" class="btn-icon-subtle" title="Перезагрузить панель">⟳</button>
        </div>
        <div class="hdr-sub" id="sub-info">Поиск играющих вкладок…</div>
      </div>
    </div>
    <div class="hdr-actions">
      <button id="btn-mute-all" class="hdr-btn" title="Заглушить все играющие вкладки">
        <svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.18l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
      </button>
      <button id="btn-reset-all" class="hdr-btn" title="Сбросить громкость на 100%">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </header>

  <div class="toggle-bar">
    <label class="toggle-label" for="chk-show-all">
      <span>Показывать все вкладки</span>
      <span class="switch-box">
        <input type="checkbox" id="chk-show-all">
        <span class="switch-slider"></span>
      </span>
    </label>
  </div>

  <main id="tab-list" class="tab-list"></main>

  <div id="empty-state" class="empty-state" hidden>
    <div class="empty-icon">🎧</div>
    <div class="empty-title">Сейчас тихо</div>
    <div class="empty-desc">Включите видео или стрим — вкладка сразу появится в этом списке.</div>
  </div>

  <footer class="ftr">
    <div id="status-text">Синхронизация громкости с плеером активна</div>
  </footer>

  <script src="sidebar.js?v=22"></script>
</body>
</html>
