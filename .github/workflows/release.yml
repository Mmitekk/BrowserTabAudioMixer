name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Extension Zip
        run: |
          zip -r BrowserTabAudioMixer.zip \
            manifest.json \
            background.js \
            sidebar.html \
            sidebar.css \
            sidebar.js \
            icons/ \
            README.md \
            LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: BrowserTabAudioMixer.zip
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Artifact (manual workflow run)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: BrowserTabAudioMixer
          path: BrowserTabAudioMixer.zip
